name: Release

# Publication sur npm déclenchée par un tag `v*`. Provenance signée
# (https://docs.npmjs.com/generating-provenance-statements) pour permettre
# la vérification supply chain depuis les projets clients.
#
# Deux canaux (2.0) :
#   - version de pré-sortie (`2.0.0-rc.1`, `2.1.0-beta.2`…) → dist-tag `next`.
#     Elle n'atteint aucun utilisateur qui n'a pas demandé `aiad-sdd@next`.
#   - version stable → dist-tag `latest`, uniquement si le commit tagué est
#     sur `main`.
# Une régression ne peut donc pas atteindre `latest` depuis une branche de
# travail, ni par un tag de pré-sortie.

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: npm publish (provenance signée)
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # requis pour `npm publish --provenance`
      contents: write   # requis pour git push metrics (SPEC-027-3)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Verify package.json version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION ≠ package.json $PKG_VERSION" >&2
            exit 1
          fi

      - name: Choisir le canal (next pour une pré-sortie, latest sinon)
        id: canal
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*) echo "tag=next" >> "$GITHUB_OUTPUT" ;;
            *)
              git fetch origin main --quiet
              if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                echo "Version stable $VERSION : le commit tagué n'est pas sur main. Publication refusée." >&2
                exit 1
              fi
              echo "tag=latest" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # Gates bloquants avant publication (SPEC-014-1 / INTENT-014) — parité avec
      # `prepublishOnly`. `npm publish` redéclenche prepublishOnly, mais on arme
      # aussi les gates ici pour un échec précoce et lisible au moment du release.
      - name: Gates qualité (lint + deps + size + couverture seuils)
        run: |
          npm run lint
          npm run lint:deps
          npm run lint:size
          npm run lint:esm
          npm run lint:claims
          node bin/aiad-sdd.js agents validate
          node scripts/check-doctrine.js
          npm run smoke
          npm run test:sdd-mode
          npm run test:coverage:threshold

      - name: Publish (avec provenance npm SLSA L3)
        run: npm publish --provenance --access public --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.canal.outputs.tag }}

      # @intent INTENT-027
      # @spec SPEC-027-3-ci-workflow-steps
      - name: Record DORA metrics
        if: success()
        continue-on-error: true
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          node bin/aiad-sdd.js dora --record --auto \
            --status=success \
            --release="$RELEASE_REF" \
            --commit="$GITHUB_SHA"

      - name: Commit metrics to repository
        if: success() && steps.canal.outputs.tag == 'latest'
        continue-on-error: true
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .aiad/metrics/deployments/
          if ! git diff --cached --quiet; then
            git commit -m "chore(metrics): record release $RELEASE_REF"
            git push origin main || (git pull --rebase origin main && git push origin main)
          fi

      # Double signature : npm provenance (SLSA L3 via Sigstore Rekor automatique)
      # + attestation AIAD interne signée HMAC vérifiable hors-ligne.
      # https://aiad.ovh/provenance — item backlog #90
      - name: Generate AIAD provenance attestation (SLSA v1.0 signed HMAC)
        if: env.AIAD_PROVENANCE_SECRET != ''
        run: node bin/aiad-sdd.js provenance generate --json
        env:
          AIAD_PROVENANCE_SECRET: ${{ secrets.AIAD_PROVENANCE_SECRET }}

      - name: Upload AIAD attestation as release artifact
        if: env.AIAD_PROVENANCE_SECRET != ''
        uses: actions/upload-artifact@v4
        with:
          name: aiad-attestation-${{ github.ref_name }}
          path: .aiad/provenance/attestation.json
          if-no-files-found: error
          retention-days: 90
        env:
          AIAD_PROVENANCE_SECRET: ${{ secrets.AIAD_PROVENANCE_SECRET }}
